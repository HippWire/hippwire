    <path id="wire" fill="#0F9F90" d="M432.81 128H442.78L454.24 85.59C455.54 80.74 456.53 76.21 457.52 70.72C458.55 76.61 459.63 81.33 460.79 85.59L472.29 128H482.22L500.55 61.07H491.75L481.19 102.12C479.75 107.79 478.4 113.58 477.24 119.78C475.98 113.58 474.63 107.79 473.15 102.12L462.41 61.07H452.71L441.88 102.12C440.36 107.88 439.05 113.76 437.84 120.05C436.63 113.76 435.32 107.88 433.89 102.12L423.29 61.07H414.57Z M508.88 128H516.97V77.78H508.88Z M530.06 128H538.14V96.55C538.14 89.77 543.44 84.88 550.68 84.88C552.83 84.88 555.03 85.23 555.53 85.32V77.19C554.58 77.15 552.61 77.06 551.44 77.06C545.47 77.06 540.25 80.43 538.41 85.5H537.87V77.78H530.06Z M584.7 129.08C594.99 129.08 602.49 123.91 604.83 116.32L597.01 114.16C595.12 119.29 590.68 121.89 584.75 121.89C575.85 121.89 569.74 116.14 569.34 105.63H605.64V102.26C605.64 83.71 594.4 77.15 583.76 77.15C570.06 77.15 561.16 87.88 561.16 103.29C561.16 118.75 570.15 129.08 584.7 129.08ZM569.38 98.8C569.88 91.12 575.13 84.34 583.76 84.34C592.02 84.34 596.65 90.27 597.41 98.8Z"/>
    <circle id="i-node" cx="512.9" cy="63.5" r="6.9" fill="#2563EB"/>
  </g>
</svg>
