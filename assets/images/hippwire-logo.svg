<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 629 200" width="629" height="200" role="img" aria-labelledby="t d">
  <title id="t">HippWire</title>
  <desc id="d">Logo: a stylised coronal section of the mouse hippocampus drawn as interlocking wire traces with neuron nodes, next to the HippWire wordmark.</desc>
  <defs>
    <linearGradient id="gA" x1="20" y1="30" x2="185" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gB" x1="80" y1="70" x2="150" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- ===== Icon: hippocampus (coronal section) as wires ===== -->
  <g id="icon" transform="translate(0 10)">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ammon's horn (CA1 -> CA3), ends in a hook around the dentate gyrus -->
    <path d="M24 104 C22 58 62 28 108 28 C156 28 186 62 179 104 C173 138 140 152 118 135 C104 124 108 104 126 103"
          stroke="url(#gA)" stroke-width="13"/>
    <!-- Dentate gyrus: a C-shaped blade wrapping the CA3 hook -->
    <path d="M134 70 C92 68 68 98 82 128 C93 150 114 162 138 160"
          stroke="url(#gB)" stroke-width="13"/>
    <!-- mossy-fibre trace linking DG to CA3 -->
    <path d="M138 160 L158 160 L170 148" stroke="#14B8A6" stroke-width="3.5"/>
    <path d="M134 70 L150 70 L160 80" stroke="#6366F1" stroke-width="3.5"/>
    <!-- Schaffer-style spur on the CA arc -->
    <path d="M66 38 L58 20 L72 8" stroke="#14B8A6" stroke-width="3.5"/>
  </g>
  <g id="nodes">
    <!-- hollow ring nodes at wire ends -->
    <g fill="#ffffff" stroke-width="5">
      <circle cx="24" cy="104" r="8" stroke="#14B8A6"/>
      <circle cx="126" cy="103" r="8" stroke="#2563EB"/>
      <circle cx="134" cy="70" r="8" stroke="#6366F1"/>
      <circle cx="138" cy="160" r="8" stroke="#14B8A6"/>
    </g>
    <!-- solid terminals on spurs -->
    <circle cx="170" cy="148" r="5.5" fill="#14B8A6"/>
    <circle cx="160" cy="80" r="5.5" fill="#6366F1"/>
    <circle cx="72" cy="8" r="5.5" fill="#14B8A6"/>
  </g>
  </g>

  <!-- ===== Wordmark (outlined text, Inter) ===== -->
